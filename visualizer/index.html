<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Log Replay</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Phase 12 · read-only inspection</p>
        <h1>Classroom Log Replay</h1>
        <p class="subhead">Open an exporter-produced replay JSON. Nothing is uploaded.</p>
      </div>
      <label class="file-button">
        <span>Open replay JSON</span>
        <input id="replay-file" type="file" accept="application/json,.json">
      </label>
    </header>

    <main>
      <section id="empty-state" class="empty-state" aria-live="polite">
        <h2>No replay loaded</h2>
        <p>Select a local replay JSON generated by <code>export-visualizer-data</code>.</p>
      </section>

      <section id="replay" class="replay hidden" aria-live="polite">
        <aside class="sidebar">
          <div class="run-card">
            <p id="run-status" class="status-pill"></p>
            <h2 id="run-id"></h2>
            <dl id="run-facts" class="facts"></dl>
          </div>

          <nav aria-label="Replay steps">
            <h3>Timeline</h3>
            <ol id="step-list" class="step-list"></ol>
          </nav>
        </aside>

        <div class="stage">
          <section class="controls" aria-label="Playback controls">
            <button id="previous" type="button">Previous</button>
            <button id="play" type="button">Play</button>
            <button id="next" type="button">Next</button>
            <label>
              Speed
              <select id="speed">
                <option value="1800">0.5×</option>
                <option value="900" selected>1×</option>
                <option value="450">2×</option>
              </select>
            </label>
            <span id="frame-count" class="frame-count"></span>
          </section>

          <section class="frame-card">
            <div class="frame-heading">
              <div>
                <p id="frame-kind" class="eyebrow"></p>
                <h2 id="frame-title"></h2>
              </div>
              <p id="logical-time" class="timestamp"></p>
            </div>
            <p id="frame-description" class="description"></p>
            <div id="frame-content"></div>
          </section>

          <section class="inspection-grid">
            <article class="panel">
              <h3>Persisted retrieval</h3>
              <div id="retrieval-panel" class="panel-content"></div>
            </article>
            <article class="panel">
              <h3>Memory evidence</h3>
              <div id="memory-panel" class="panel-content"></div>
            </article>
            <article class="panel">
              <h3>Audit &amp; optional overlays</h3>
              <div id="overlay-panel" class="panel-content"></div>
            </article>
          </section>
        </div>
      </section>
    </main>

    <template id="empty-panel-template">
      <p class="muted">No persisted evidence for this frame.</p>
    </template>
    <script src="app.js" defer></script>
  </body>
</html>
